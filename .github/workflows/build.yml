name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    name: Build

    steps:
      - name: Windows config
        run: |
          git config --system core.longpaths true
          echo "Enabled long paths in git"

          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          echo "Enabled long paths in registry"

          $git_link = "C:\Program Files\Git\usr\bin\link.exe"
          if (Test-Path $git_link) {
              Rename-Item $git_link "_link.exe"
          }
          echo "Removed link.exe in git"

      - name: Install ATL/MFC for latest v143 toolset
        shell: powershell
        run: |
          # GitHub 官方镜像里 vs_installer 路径固定就是下面这个
          $installer = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"

          # VS2022 的实际安装路径（windows-latest 一定是 Enterprise 版）
          $installPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"

          # 如果因为某些原因找不到，就用 where 命令再找一遍（保险）
          if (-not (Test-Path $installPath)) {
            $installPath = (Get-CimInstance -ClassName MSFT_VSInstance).InstallLocation.TrimEnd('\')
          }

          Write-Host "Using VS installation path: $installPath"

          & $installer modify `
            --installPath "$installPath" `
            --add Microsoft.VisualStudio.Component.VC.ATLMFC `
            --add Microsoft.VisualStudio.Component.VC.ATL `
            --quiet --norestart --nocache --wait

          if ($LASTEXITCODE -ne 0) {
            Write-Error "vs_installer failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          Write-Host "ATL/MFC installed successfully"

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: 14.29
          sdk: 10.0.19041.0

      - name: Checkout target
        uses: actions/checkout@v6
        with:
          repository: voidtools/voidImageViewer
          ref: refs/tags/1.0.0.13
          path: voidImageViewer

      - name: Build
        working-directory: voidImageViewer/vs2019
        run: |
          msbuild voidImageViewer.sln `
          /p:Platform=x64 `
          /p:Configuration=Release `
          /p:WholeProgramOptimization=true `
          /p:Optimization=MinSpace `
          /p:FunctionLevelLinking=true
      # /p:WindowsTargetPlatformVersion=10.0.19041.0 `
      # /p:PlatformToolset=v142 `
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: voidImageViewer
          path: |
            voidImageViewer/bin/Release/x64/*.exe
            voidImageViewer/bin/Release/x64/*.dll
