name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    name: Build

    steps:
      - name: Windows config
        run: |
          git config --system core.longpaths true
          echo "Enabled long paths in git"

          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          echo "Enabled long paths in registry"

          $git_link = "C:\Program Files\Git\usr\bin\link.exe"
          if (Test-Path $git_link) {
              Rename-Item $git_link "_link.exe"
          }
          echo "Removed link.exe in git"

      - name: Install ATL/MFC components
        shell: powershell
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe")) {
            Invoke-WebRequest -Uri "https://aka.ms/vs/16/release/vs_buildtools.exe" -OutFile "vs_buildtools.exe"
            ./vs_buildtools.exe --quiet --wait --norestart --nocache --includeRecommended --add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.ATLMFC  # 添加 ATL/MFC
          } else {
            & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe" modify --installPath "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs" --add Microsoft.VisualStudio.Component.VC.ATLMFC --quiet --norestart --nocache
          }
          echo "Start checking ATL/MFC components..."
          echo $env:INCLUDE | FindStr /I "atlmfc"
          echo $env:LIB     | FindStr /I "atlmfc"

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: 14.29
          sdk: 10.0.19041.0

      - name: Checkout target
        uses: actions/checkout@v6
        with:
          repository: voidtools/voidImageViewer
          ref: refs/tags/1.0.0.13
          path: voidImageViewer

      - name: Build
        working-directory: voidImageViewer/vs2019
        run: |
          msbuild voidImageViewer.sln `
          /p:Platform=x64 `
          /p:Configuration=Release `
          /p:WholeProgramOptimization=true `
          /p:Optimization=MinSpace `
          /p:FunctionLevelLinking=true
      # /p:WindowsTargetPlatformVersion=10.0.19041.0 `
      # /p:PlatformToolset=v142 `
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: voidImageViewer
          path: |
            voidImageViewer/bin/Release/x64/*.exe
            voidImageViewer/bin/Release/x64/*.dll
