name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    name: Build

    steps:
      - name: Windows config
        run: |
          git config --system core.longpaths true
          echo "Enabled long paths in git"

          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          echo "Enabled long paths in registry"

          $git_link = "C:\Program Files\Git\usr\bin\link.exe"
          if (Test-Path $git_link) {
              Rename-Item $git_link "_link.exe"
          }
          echo "Removed link.exe in git"

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: 14.29
          sdk: 10.0.19041.0

      - name: Checkout Self
        uses: actions/checkout@v6

      - name: Setup ATLMFC
        shell: pwsh
        run: |
          7z x atlmfc.7z -o"$env:VCToolsInstallDir"
          $env:LIBPATH = "$env:VCToolsInstallDir\atlmfc\lib;" + $env:LIBPATH
          $env:INCLUDE = "$env:VCToolsInstallDir\atlmfc\include;" + $env:INCLUDE

      - name: Checkout target
        uses: actions/checkout@v6
        with:
          repository: voidtools/voidImageViewer
          # ref: refs/tags/1.0.0.15
          path: voidImageViewer

      - name: Build
        working-directory: voidImageViewer/vs2019
        shell: pwsh
        run: |
          msbuild voidImageViewer.sln `
          /p:PlatformToolset=v142 `
          /p:WindowsTargetPlatformVersion=10.0.19041.0 `
          /p:Platform=x64 `
          /p:Configuration=Release `
          /p:WholeProgramOptimization=true `
          /p:Optimization=MinSpace `
          /p:FunctionLevelLinking=true

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: voidImageViewer
          path: |
            voidImageViewer/vs2019/x64/Release/*.exe
            voidImageViewer/vs2019/x64/Release/*.dll
