name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    name: Build

    steps:
      - name: Windows config
        run: |
          git config --system core.longpaths true
          echo "Enabled long paths in git"

          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          echo "Enabled long paths in registry"

          $git_link = "C:\Program Files\Git\usr\bin\link.exe"
          if (Test-Path $git_link) {
              Rename-Item $git_link "_link.exe"
          }
          echo "Removed link.exe in git"

      - name: Install ATL/MFC (VS2022 17.12+ 最新镜像专用)
        shell: powershell
        run: |
          $installer = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
          $installPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"

          Write-Host "Installing latest ATL/MFC components..."

          & $installer modify --installPath "$installPath" `
            --quiet --norestart --nocache --wait `
            --add Microsoft.VisualStudio.Component.VC.ATL.x86.x64 `
            --add Microsoft.VisualStudio.Component.VC.ATLMFC.x86.x64 `
            --add Microsoft.VisualStudio.Component.VC.ATL.x86.x64.Spectre `
            --add Microsoft.VisualStudio.Component.VC.ATLMFC.x86.x64.Spectre

          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 0 -or $exitCode -eq 3010) {
            Write-Host "ATL/MFC components installed successfully (exit code $exitCode)"
          } else {
            Write-Error "vs_installer failed with exit code $exitCode"
            exit $exitCode
          }

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: 14.29
          sdk: 10.0.19041.0

      - name: Checkout target
        uses: actions/checkout@v6
        with:
          repository: voidtools/voidImageViewer
          ref: refs/tags/1.0.0.13
          path: voidImageViewer

      - name: Build
        working-directory: voidImageViewer/vs2019
        run: |
          msbuild voidImageViewer.sln `
          /p:Platform=x64 `
          /p:Configuration=Release `
          /p:WholeProgramOptimization=true `
          /p:Optimization=MinSpace `
          /p:FunctionLevelLinking=true
      # /p:WindowsTargetPlatformVersion=10.0.19041.0 `
      # /p:PlatformToolset=v142 `
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: voidImageViewer
          path: |
            voidImageViewer/bin/Release/x64/*.exe
            voidImageViewer/bin/Release/x64/*.dll
